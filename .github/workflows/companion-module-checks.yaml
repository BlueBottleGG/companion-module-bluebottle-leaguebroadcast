name: Companion Module Checks

on:
  push:

jobs:
  check:
    name: Check module
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn companion-module-check
      - run: yarn package
